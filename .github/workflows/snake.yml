name: Serpiente de contribuciones

on:
  schedule:
    - cron: "17 3 * * *"   # cada día a las 03:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/snake.yml"]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generar la serpiente (rojo Laravel, claro y oscuro)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#ff2d20&color_dots=#161b22,#4c1410,#8f1d14,#d4261b,#ff6b5e
            dist/snake-light.svg?color_snake=#1f2328&color_dots=#ebedf0,#ffd3cf,#ff9b92,#f0584d,#e3261a

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
