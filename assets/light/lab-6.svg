<svg xmlns="http://www.w3.org/2000/svg" width="390" height="236" viewBox="0 0 390 236" fill="none" role="img" aria-label="Stable Diffusion — Generador de imágenes a partir de descripciones en texto.">
<title>Stable Diffusion — Generador de imágenes a partir de descripciones en texto.</title>
<defs><style>
@font-face{font-family:'R-Inter';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'R-Inter';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'R-Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{opacity:0;animation:fu 1s cubic-bezier(.22,.8,.24,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{opacity:0;animation:fi 1.2s ease forwards}
@keyframes fi{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.fi{opacity:1}.draw{stroke-dashoffset:0}}

.float{animation:float 6s ease-in-out 2.24s infinite}@keyframes float{50%{transform:translateY(-3px)}}.ico{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) forwards}
</style></defs>
<g class="fi" style="animation-delay:0.24s"><rect x=".5" y=".5" width="389" height="235" rx="16" fill="#f6f8fa" stroke="#e1e6eb"/></g>
<g class="fi" style="animation-delay:0.34s"><rect x="28.5" y="28.5" width="60" height="60" rx="15" fill="none" stroke="#e1e6eb"/></g>
<g class="float"><g transform="translate(41.7 41.7) scale(1.4)"><path d="M4 5h16v14H4z" stroke="#e3261a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="ico" style="animation-delay:0.54s"/><path d="M4 16l4.5-4.5 3.5 3.5 2.5-2.5L20 17" stroke="#e3261a" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="ico" style="animation-delay:0.64s"/><circle cx="15.5" cy="9.3" r="1.3" stroke="#e3261a" stroke-width="1.2" pathLength="1" class="ico" style="animation-delay:0.74s"/></g></g>
<g class="fu" style="animation-delay:0.49s"><path d="M350 44 L360 34 M352.8 34 H360 V41.2" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fu" style="animation-delay:0.54s"><text x="28.0" y="130.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="500" font-style="normal" font-size="19" fill="#1f2328" text-anchor="start">Stable Diffusion</text></g>
<g class="fu" style="animation-delay:0.62s"><text x="28.0" y="158.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="300" font-style="normal" font-size="14.5" fill="#59636e" text-anchor="start">Generador de imágenes a partir de descripciones</text></g>
<g class="fu" style="animation-delay:0.68s"><text x="28.0" y="179.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="300" font-style="normal" font-size="14.5" fill="#59636e" text-anchor="start">en texto.</text></g>
<g class="fu" style="animation-delay:0.74s"><text x="28.0" y="212.0" font-family="R-Mono,'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" font-style="normal" font-size="10.5" fill="#e3261a" text-anchor="start" letter-spacing="1.4">PYTHON · PYTORCH</text></g>
