<path d="M205 46 H1035" stroke="#d1d9e0" stroke-width="1" pathLength="1" class="draw" style="animation-delay:0.25s"/>
<g class="fi" style="animation-delay:0.90s"><text x="1200.0" y="50.0" font-size="13" text-anchor="end" xml:space="preserve"><tspan font-family="R-Mono,'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" font-style="normal" fill="#e3261a">$ </tspan><tspan font-family="R-Mono,'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" font-style="normal" fill="#818b98">git log --oneline</tspan></text></g>
