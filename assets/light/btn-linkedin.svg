<svg xmlns="http://www.w3.org/2000/svg" width="142" height="48" viewBox="0 0 142 48" fill="none" role="img" aria-label="LinkedIn">
<title>LinkedIn</title>
<defs><style>
@font-face{font-family:'R-Inter';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{opacity:0;animation:fu 1s cubic-bezier(.22,.8,.24,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{opacity:0;animation:fi 1.2s ease forwards}
@keyframes fi{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.fi{opacity:1}.draw{stroke-dashoffset:0}}


</style></defs>
<g class="fu" style="animation-delay:0.00s"><rect x=".75" y=".75" width="140.5" height="46.5" rx="23.25" fill="#f6f8fa" stroke="#e1e6eb" stroke-width="1.5"/><circle cx="24" cy="24" r="3.5" fill="#e3261a"/><text x="38.0" y="29.5" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="500" font-style="normal" font-size="15" fill="#1f2328" text-anchor="start">LinkedIn</text><path d="M111 28 L120 19 M113.52 19 H120 V25.48" stroke="#818b98" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
