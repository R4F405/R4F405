<svg xmlns="http://www.w3.org/2000/svg" width="390" height="236" viewBox="0 0 390 236" fill="none" role="img" aria-label="Maps Scraper GUI — Interfaz de escritorio para extraer negocios de Google Maps.">
<title>Maps Scraper GUI — Interfaz de escritorio para extraer negocios de Google Maps.</title>
<defs><style>
@font-face{font-family:'R-Inter';font-weight:500;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'R-Inter';font-weight:300;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'R-Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{opacity:0;animation:fu 1s cubic-bezier(.22,.8,.24,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{opacity:0;animation:fi 1.2s ease forwards}
@keyframes fi{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.fi{opacity:1}.draw{stroke-dashoffset:0}}

.float{animation:float 6s ease-in-out 2.00s infinite}@keyframes float{50%{transform:translateY(-3px)}}.ico{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.65,0,.35,1) forwards}
</style></defs>
<g class="fi" style="animation-delay:0.00s"><rect x=".5" y=".5" width="389" height="235" rx="16" fill="#161b22" stroke="#262c34"/></g>
<g class="fi" style="animation-delay:0.10s"><rect x="28.5" y="28.5" width="60" height="60" rx="15" fill="none" stroke="#262c34"/></g>
<g class="float"><g transform="translate(41.7 41.7) scale(1.4)"><path d="M12 21s-6.5-5.6-6.5-11a6.5 6.5 0 0 1 13 0c0 5.4-6.5 11-6.5 11z" stroke="#ff2d20" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" pathLength="1" class="ico" style="animation-delay:0.30s"/><circle cx="12" cy="10" r="2.5" stroke="#ff2d20" stroke-width="1.2" pathLength="1" class="ico" style="animation-delay:0.40s"/></g></g>
<g class="fu" style="animation-delay:0.25s"><path d="M350 44 L360 34 M352.8 34 H360 V41.2" stroke="#6e7681" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></g>
<g class="fu" style="animation-delay:0.30s"><text x="28.0" y="130.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="500" font-style="normal" font-size="19" fill="#e6edf3" text-anchor="start">Maps Scraper GUI</text></g>
<g class="fu" style="animation-delay:0.38s"><text x="28.0" y="158.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="300" font-style="normal" font-size="14.5" fill="#8b949e" text-anchor="start">Interfaz de escritorio para extraer negocios de</text></g>
<g class="fu" style="animation-delay:0.44s"><text x="28.0" y="179.0" font-family="R-Inter,'Inter','Segoe UI',-apple-system,Helvetica,Arial,sans-serif" font-weight="300" font-style="normal" font-size="14.5" fill="#8b949e" text-anchor="start">Google Maps.</text></g>
<g class="fu" style="animation-delay:0.50s"><text x="28.0" y="212.0" font-family="R-Mono,'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" font-style="normal" font-size="10.5" fill="#ff2d20" text-anchor="start" letter-spacing="1.4">PYTHON · TKINTER</text></g>
</svg>
