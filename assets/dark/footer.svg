<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" fill="none" role="img" aria-label="Si tengo que hacer algo dos veces a mano, a la tercera lo automatizo.">
<title>Si tengo que hacer algo dos veces a mano, a la tercera lo automatizo.</title>
<defs><style>
@font-face{font-family:'R-Serif';font-weight:400;font-style:italic;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:'R-Mono';font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2')}

.fu{opacity:0;animation:fu 1s cubic-bezier(.22,.8,.24,1) forwards}
@keyframes fu{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.fi{opacity:0;animation:fi 1.2s ease forwards}
@keyframes fi{to{opacity:1}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.65,0,.35,1) forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.blink{animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fu,.fi{opacity:1}.draw{stroke-dashoffset:0}}

.pulse{animation:pulse 3.2s ease-in-out 2s infinite;transform-box:fill-box;transform-origin:center}@keyframes pulse{50%{transform:scale(1.7);opacity:.35}}
</style></defs>
<path d="M600.0 30 H40.0" stroke="#30363d" pathLength="1" class="draw" style="animation-delay:0.10s"/>
<path d="M600.0 30 H1160.0" stroke="#30363d" pathLength="1" class="draw" style="animation-delay:0.10s"/>
<g class="fi" style="animation-delay:0.50s"><rect x="586.0" y="22" width="28" height="16" fill="#21262d" opacity="0"/><circle cx="600.0" cy="30" r="4" fill="#ff2d20" class="pulse"/></g>
<g class="fu" style="animation-delay:0.60s"><text x="600.0" y="104.0" font-family="R-Serif,'Instrument Serif',Georgia,'Times New Roman',serif" font-weight="400" font-style="italic" font-size="30" fill="#e6edf3" text-anchor="middle">“Si tengo que hacer algo dos veces a mano,</text></g>
<g class="fu" style="animation-delay:0.72s"><text x="600.0" y="144.0" font-family="R-Serif,'Instrument Serif',Georgia,'Times New Roman',serif" font-weight="400" font-style="italic" font-size="30" fill="#e6edf3" text-anchor="middle">a la tercera lo automatizo.”</text></g>
<g class="fu" style="animation-delay:1.00s"><text x="600.0" y="196.0" font-family="R-Mono,'JetBrains Mono',Consolas,'DejaVu Sans Mono',monospace" font-weight="400" font-style="normal" font-size="11.5" fill="#6e7681" text-anchor="middle" letter-spacing="3">R4F405</text></g>
</svg>
